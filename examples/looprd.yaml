apiVersion: looprd/v1
component: example-project
release: 1.2.3
api:
  version: v1
auth:
  mode: database
  scopes: [items:read, items:write, events:read]
database:
  backend: sqlite
  schemaVersion: 1
models:
  Item:
    fields:
      id:
        type: integer
        primaryKey: true
        generated: true
      name:
        type: string
        maxLength: 100
        required: true
resources:
  items:
    model: Item
    path: /items
    operations: [list, get, create, update, delete]
    permissions:
      list: [items:read]
      get: [items:read]
      create: [items:write]
      update: [items:write]
      delete: [items:write]
websocket:
  path: /events
  resources: [items]
  permissions:
    items: [events:read]
